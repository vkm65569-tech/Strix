name: Strix Security Scan

# Runs the Strix AI pentest agent headlessly on a GitHub runner.
# Strix exits with code 2 when it finds vulnerabilities, 0 when clean, 1 on error.

on:
  # Run it by hand from the Actions tab. This is the normal way to use it.
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "How hard to scan"
        type: choice
        options: [quick, standard, deep]
        default: quick
      target_mode:
        description: "What to scan"
        type: choice
        options:
          - targets_file     # scan every repo listed in targets.txt
          - this_repo        # scan the code in THIS repository
          - custom_url       # scan a live URL or repo you type below
        default: targets_file
      custom_target:
        description: "Only used when target_mode = custom_url (e.g. https://myapp.com)"
        type: string
        required: false
        default: ""
      budget:
        description: "Maximum USD to spend on this single run"
        type: string
        default: "10"
  # Weekly safety net. Comment out if you only want manual runs.
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC

# The scan may end with exit code 2 (vulnerabilities found). We handle that
# ourselves and still want to publish the report artifact.
permissions:
  contents: read

concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strix:
    name: Strix pentest
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      # Secrets live in: Settings -> Secrets and variables -> Actions
      # STRIX_LLM is the model string, e.g. openrouter/z-ai/glm-5.3
      STRIX_LLM: ${{ secrets.STRIX_LLM }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SCAN_MODE: ${{ inputs.scan_mode || 'quick' }}
      TARGET_MODE: ${{ inputs.target_mode || 'targets_file' }}
      CUSTOM_TARGET: ${{ inputs.custom_target || '' }}
      BUDGET: ${{ inputs.budget || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Strix scopes PR/diff scans by comparing against the base branch,
          # which needs real history rather than a shallow clone.
          fetch-depth: 0

      - name: Free up disk space
        # The Strix sandbox image is large and ubuntu-latest only has ~14 GB.
        # Removing preinstalled SDKs that a pentest run does not need.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Verify Docker is available
        run: |
          docker version
          docker info >/dev/null
          echo "Docker daemon is running."

      - name: Check that secrets are configured
        run: |
          missing=0
          if [ -z "$STRIX_LLM" ]; then
            echo "::error::Secret STRIX_LLM is not set (e.g. openrouter/z-ai/glm-5.3)"
            missing=1
          fi
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Secret LLM_API_KEY is not set"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Add them under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "Both secrets are present. Model: $STRIX_LLM"

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          # The installer exports the CLI location for GitHub runners itself.
          strix --version

      - name: Pull the Strix sandbox image
        run: docker pull ghcr.io/usestrix/strix-sandbox:1.3.0

      - name: Build the target list
        id: targets
        run: |
          case "$TARGET_MODE" in
            this_repo)
              echo "args=-t ./" >> "$GITHUB_OUTPUT"
              ;;
            custom_url)
              if [ -z "$CUSTOM_TARGET" ]; then
                echo "::error::target_mode=custom_url but custom_target was empty."
                exit 1
              fi
              echo "args=-t $CUSTOM_TARGET" >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ ! -s targets.txt ]; then
                echo "::error::targets.txt is missing or empty."
                exit 1
              fi
              echo "args=--target-list ./targets.txt" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Scan arguments: $(grep '^args=' "$GITHUB_OUTPUT" | cut -d= -f2-)"

      - name: Run Strix
        id: scan
        run: |
          set +e
          strix -n \
            ${{ steps.targets.outputs.args }} \
            --scan-mode "$SCAN_MODE" \
            --instruction-file ./strix.instructions.md \
            --max-budget "$BUDGET" \
            2>&1 | tee strix-console.log
          code=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "::notice::Strix finished and found no confirmed vulnerabilities." ;;
            2) echo "::warning::Strix reported vulnerabilities. See the artifact and job summary." ;;
            *) echo "::error::Strix exited with code $code (fatal error). Check strix-console.log." ;;
          esac
          # Do not fail the job here; the summary step decides the final status.

      - name: Publish the report to the job summary
        if: always()
        run: |
          {
            echo "## Strix scan result"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Scan mode | \`$SCAN_MODE\` |"
            echo "| Target mode | \`$TARGET_MODE\` |"
            echo "| Model | \`$STRIX_LLM\` |"
            echo "| Budget cap | \$$BUDGET |"
            echo "| Exit code | \`${{ steps.scan.outputs.exit_code }}\` |"
            echo ""
            if [ "${{ steps.scan.outputs.exit_code }}" = "2" ]; then
              echo "**Vulnerabilities were reported.** Download the \`strix-report\` artifact below for the full findings, proof-of-concepts, and remediation notes."
            elif [ "${{ steps.scan.outputs.exit_code }}" = "0" ]; then
              echo "**No confirmed vulnerabilities were reported** in this run."
            else
              echo "**The scan did not complete.** See the \`strix-console.log\` in the artifact and the run log above."
            fi
            echo ""
            echo "<details><summary>Tail of the console output</summary>"
            echo ""
            echo '```'
            tail -n 60 strix-console.log 2>/dev/null || echo "(no console log produced)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-report
          # Strix writes machine-readable results to strix_runs/<run-name>/
          path: |
            strix_runs/
            strix-console.log
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run if vulnerabilities were found
        if: steps.scan.outputs.exit_code == '2'
        run: |
          echo "::error::Strix found vulnerabilities. Review the strix-report artifact."
          exit 2
